async function claimSlot(t,u){
  const put=(key,rec,cond)=>fetch(FB+'/claims/'+key+'.json',{method:'PUT',headers:cond?{'if-match':'null_etag'}:{},body:JSON.stringify(rec)});
  let atomic=true;
  for(let i=0;i<8;i++){
    const used=new Set(DB.claims.filter(c=>c.taskId===t.id).map(c=>c.slot)),free=[];for(let k=0;k<t.max;k++)if(!used.has(k))free.push(k);
    if(!free.length)return null;
    const slot=free[Math.floor(Math.random()*free.length)],key=t.id+'_'+slot,rec={id:key,taskId:t.id,uid:u.id,slot,t:now()};
    try{const r=await put(key,rec,atomic);
      if(r.ok){if(!DB.claims.some(c=>c.id===key))DB.claims.push(rec);SNAPJ['claims/'+key]=JSON.stringify(rec);return slot}
      if(r.status===412){if(!DB.claims.some(c=>c.id===key)){const o={id:key,taskId:t.id,uid:'?',slot,t:now()};DB.claims.push(o);SNAPJ['claims/'+key]=JSON.stringify(o)}continue}
      throw new Error('HTTP '+r.status)}
    catch(e){if(e instanceof TypeError&&atomic){atomic=false;i--;continue}throw e}}
  return null}

function confirmBox(msg,cb){window._cb=cb;sheet('<h2>Confirm</h2><p class="mu" style="margin-bottom:14px">'+esc(msg)+'</p><div class="grid2"><button class="btn gh" onclick="closeSheet()">Cancel</button><button class="btn" onclick="closeSheet();window._cb()">Yes, continue</button></div>')}
function img(src){sheet('<img src="'+src+'" style="width:100%;border-radius:12px"><button class="btn gh" style="margin-top:10px" onclick="closeSheet()">Close</button>')}
function pager(total,per,fn){const n=Math.max(1,Math.ceil(total/per));if(n<2)return '';let h='<div class="row c wrap" style="justify-content:center;margin-top:10px">';for(let i=1;i<=n&&i<=12;i++)h+='<span class="chip '+(i===S.page?'on':'')+'" onclick="A.pg('+i+')">'+i+'</span>';return h+'</div>'}
function empty(t,cta,fn){return '<div class="c mu" style="padding:28px 10px"><div style="font-size:34px">&#9711;</div><p style="margin:8px 0">'+esc(t)+'</p>'+(cta?'<button class="btn xs" onclick="'+fn+'">'+esc(cta)+'</button>':'')+'</div>'}
function bars(vals,labels){const mx=Math.max(...vals,.0001);return '<div class="bars" style="margin-bottom:20px">'+vals.map((v,i)=>'<div style="height:'+Math.max(3,v/mx*100)+'%"><span>'+esc(labels[i])+'</span></div>').join('')+'</div>'}
function last7(){const a=[];for(let i=6;i>=0;i--)a.push(day(now()-i*DAY));return a}
function strength(p){let s=0;if(p.length>=6)s++;if(p.length>=10)s++;if(/[A-Z]/.test(p)&&/[a-z]/.test(p))s++;if(/\d/.test(p)&&/[^A-Za-z0-9]/.test(p))s++;return s}
function compress(file,wm){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);x.font='bold 14px sans-serif';x.fillStyle='rgba(255,255,255,.6)';x.fillText(wm,8,c.height-8);let q=.7,d=c.toDataURL('image/jpeg',q);while(d.length>160000&&q>.25){q-=.1;d=c.toDataURL('image/jpeg',q)}res(d)};im.src=r.result};r.readAsDataURL(file)})}
function fakeShot(t){const c=document.createElement('canvas');c.width=300;c.height=300;const x=c.getContext('2d');x.fillStyle='#1b2a3a';x.fillRect(0,0,300,300);x.fillStyle='#00D1FF';x.font='bold 22px sans-serif';x.fillText(t,20,150);return c.toDataURL('image/jpeg',.6)}

/* ============ BUSINESS LOGIC ============ */
function lvlRewards(u){const l=lvOf(u.tasksDone||0);u.lvPaid=u.lvPaid||{};[[5,1],[10,5]].forEach(([L,a])=>{if(l>=L&&!u.lvPaid[L]){u.lvPaid[L]=1;bal(u,a);addLog(u,'bonus',a,'Level '+L+' reward');notify(u.id,'Level '+L+' reward '+m(a)+' added','reward')}})}
function payProof(p,by){
  if(p.paid)return false;const t=tBy(p.taskId),w=uBy(p.workerId);if(!t||!w)return false;
  p.paid=true;p.status='approved';p.decidedBy=by;p.decidedAt=now();
  bal(w,t.price);inc(w,'earned',t.price);inc(w,'tasksDone',1);addLog(w,'task',t.price,'Task approved: '+t.title);
  notify(w.id,'Task Proof Approved '+m(t.price),'task');
  const st=getSet();
  if(w.refBy){const r=uBy(w.refBy);if(r){const c=t.price*st.refPct/100;bal(r,c);inc(r,'refEarned',c);inc(r,'earned',c);addLog(r,'ref',c,'Referral earn from '+w.ec);notify(r.id,'Referral Earn '+m(c)+' ('+st.refPct+'%)','ref');
      const rb=getRefB();if(rb.on&&!w.refBonusPaid&&(w.tasksDone||0)>=rb.tasks){w.refBonusPaid=true;bal(r,rb.amt);inc(r,'refEarned',rb.amt);inc(r,'earned',rb.amt);addLog(r,'refb',rb.amt,'Referral bonus: '+w.ec+' finished '+rb.tasks+' tasks');notify(r.id,'Referral bonus '+m(rb.amt)+': '+w.name+' completed '+rb.tasks+' tasks','ref')}}}
  lvlRewards(w);return true}
function filled(t){return DB.proofs.filter(p=>p.taskId===t.id&&['pending','approved','appealed'].includes(p.status)).length}
function unitCost(t){return t.perSlot!==undefined?t.perSlot:t.total/t.max}
function expireTasks(){if(!LOADED)return;let ch=false;DB.tasks.forEach(t=>{if(t.status==='active'&&now()>t.expires&&(S.admin||(S.user&&t.owner===S.user.id))){t.status='expired';const left=t.max-filled(t);if(left>0){const o=uBy(t.owner);if(o){const a=left*unitCost(t),f0=t.fromDep;let rd=a,re=0;if(f0!==undefined){const tt=(f0+(t.fromEarn||0))||1;rd=a*(f0/tt);re=a-rd}if(rd>0)inc(o,'dep',rd);if(re>0)bal(o,re);t.fee=Math.max(0,(t.fee||0)-left*(unitCost(t)-t.price));addLog(o,'refund',a,'Unused budget refund: '+t.title);notify(o.id,'Task expired. Refund '+m(a)+' added','refund')}}ch=true}});if(ch)save()}
function curUser(){return S.user=S.sess&&S.sess.t==='u'?uBy(S.sess.id):null}
function unread(){const to=S.admin?'admin':(S.user&&S.user.id);return DB.notifs.filter(n=>n.to===to&&!n.read).length}

tab(t){S.tab=t;if(t!=='inbox')S.chatUid=null;S.page=1;S.q='';render()},
pg(n){S.page=n;refresh();window.scrollTo(0,0)},
q(v){S.q=v;S.page=1;clearTimeout(A._d);A._d=setTimeout(refresh,200)},
fcat(c){S.f.cat=c;render()},
eye(id){const e=$('#'+id);e.type=e.type==='password'?'text':'password'},
pw(v){const s=strength(v),b=$('#pwb');b.style.width=s*25+'%';b.style.background=['#FF4D6A','#FF4D6A','#FFC24D','#00D1FF','#00FF9D'][s]},
onbDone(){LS.set('onboardingDone',true);go('home')},
copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied','ok')).catch(()=>{const e=document.createElement('textarea');e.value=t;document.body.appendChild(e);e.select();try{document.execCommand('copy');toast('Copied','ok')}catch(x){toast('Copy failed','err')}e.remove()})},
share(w){const link=refLink(),tx=encodeURIComponent(shareText());window.open(w==='wa'?'https://wa.me/?text='+tx:w==='tg'?'https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+tx:'https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(link)+'&quote='+tx,'_blank')},
async shareNow(){const text=shareText();try{const src=CFG.logo||'icon-512.png',blob=await(await fetch(src)).blob(),file=new File([blob],'earnchain.png',{type:blob.type||'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text});return}}catch(e){if(e&&e.name==='AbortError')return}if(navigator.share){try{await navigator.share({text})}catch(e){}return}A.copy(text)},
install(){if(window._ip){window._ip.prompt()}else toast('Use browser menu > Add to Home screen')},
update(){toast('You are on V27, the latest version','ok')},
logout(){S.sess=null;LS.set('ec_sess',null);go('auth','login')},

/* auth */
login(){const id=$('#lg').value.trim(),pw=$('#lp').value;if(!id||!pw)return toast('Enter ID and password','err');
  const fails=LS.get('ec_fail',0);
  if(fails>=2&&$('#cpi').value.trim()!==CAP){newCap();return toast('Wrong captcha','err')}
  const bad=()=>{LS.set('ec_fail',fails+1);if(fails+1>=2){const b=$('#capbox');if(b)b.style.display='block'}newCap();$('#lp').value='';return toast('Wrong ID or password','err')};
  const ad=getAdm();if(id===ad.id&&enc(pw)===ad.pass){LS.set('ec_fail',0);S.sess={t:'a'};LS.set('ec_sess',S.sess);S.tab='dash';return go('admin')}
  const u=DB.users.find(x=>[x.ec.toLowerCase(),(x.email||'').toLowerCase(),x.phone].includes(id.toLowerCase()));
  if(!u||u.pass!==enc(pw))return bad();if(u.banned)return toast('Account banned','err');
  LS.set('ec_fail',0);S.sess={t:'u',id:u.id};LS.set('ec_sess',S.sess);go('home')},
register(){const n=$('#rn').value.trim(),e=$('#re').value.trim().toLowerCase(),p=$('#rp').value.trim(),w=$('#rw').value,r=$('#rr').value.trim(),bad=x=>{newCap();return toast(x,'err')};
  if($('#cpi').value.trim()!==CAP)return bad('Wrong captcha');
  if(!getApp().regOpen)return bad('Registration is closed right now');
  if(n.length<2)return bad('Enter your name');if(!/^\S+@\S+\.\S+$/.test(e))return bad('Enter a valid email');if(p.length<8)return bad('Enter a valid phone');if(w.length<6)return bad('Password needs 6+ characters');
  if(!$('#rt').checked)return bad('Accept Terms & Privacy');
  if(DB.users.some(x=>x.email===e||x.phone===p))return bad('Email or phone already registered');
  const same=DB.users.filter(x=>x.fp===fp&&now()-x.created<DAY).length;if(same>=3)return bad('Too many accounts from this device. Try later.');
  const ref=r?uEc(r):null;let refBy=null;if(ref){if(ref.fp===fp)toast('Self-referral blocked','err');else refBy=ref.id}
  const u={id:uid(),ec:newEc(),name:n,email:e,phone:p,pass:enc(w),balance:0,dep:0,earned:0,refBy,refCode:r.toUpperCase(),fp,created:now(),tasksDone:0,flag:same>=2};
  DB.users.push(u);if(refBy){notify(refBy,'New Referral Joined '+u.ec,'ref')}save();S.sess={t:'u',id:u.id};LS.set('ec_sess',S.sess);LS.set('ec_ref','');toast('Welcome, your ID is '+u.ec,'ok');go('home')},
async fgSend(){const em=$('#fe').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(em))return toast('Enter your email','err');const u=DB.users.find(x=>(x.email||'').toLowerCase()===em);if(!u)return toast('No account found with this email','err');
  const d=day();if(u.fgDay===d&&(u.fgN||0)>=2)return toast('Password reset is limited to 2 times per day. Try again tomorrow.','err');
  const otp=String(100000+Math.floor(Math.random()*900000)),b=$('#fsb');if(b)b.disabled=true;
  try{await sendOtpMail(em,otp)}catch(e){if(b)b.disabled=false;return toast('Could not send the email: '+String(e.message).slice(0,90),'err')}
  u.fgN=(u.fgDay===d?(u.fgN||0):0)+1;u.fgDay=d;save();
  FG={uid:u.id,h:enc('otp|'+otp),exp:now()+120000,tries:0,start:now()};go('auth','forgot2');A.fgTick();toast('OTP sent to your email','ok')},
fgTick(){clearInterval(A._ft);A._ft=setInterval(()=>{const e=$('#fct');if(!e||!FG){clearInterval(A._ft);return}const left=Math.max(0,60-Math.floor((now()-FG.start)/1000));e.textContent=left>0?'OTP valid for '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0'):'Time is up. If the code does not work, request a new OTP.'},500)},
forgot(){const o=($('#fo').value||'').trim(),w=$('#fw').value;if(!FG||now()>FG.exp){FG=null;go('auth','forgot');return toast('OTP expired. Request a new one.','err')}
  if(w.length<6)return toast('Password needs 6+ characters','err');FG.tries++;if(FG.tries>5){FG=null;go('auth','forgot');return toast('Too many wrong attempts. Request a new OTP.','err')}
  if(enc('otp|'+o)!==FG.h)return toast('Wrong OTP','err');const u=uBy(FG.uid);if(!u)return toast('Account not found','err');u.pass=enc(w);FG=null;save();toast('Password changed. Please login.','ok');go('auth','login')},
saveMail(){const c={service:$('#em_s').value.trim(),template:$('#em_t').value.trim(),key:$('#em_k').value.trim()};if(!c.service||!c.template||!c.key)return toast('Fill all three fields','err');CFG.email=c;save();toast('Saved','ok')},
async testMail(){const to=$('#em_to').value.trim();if(!/^\S+@\S+\.\S+$/.test(to))return toast('Enter an email','err');try{await sendOtpMail(to,'123456');toast('Test email sent','ok')}catch(e){toast('Failed: '+String(e.message).slice(0,90),'err')}},

/* tasks */
task(id){const t=tBy(id),u=S.user;if(!t)return;const mine=DB.proofs.find(p=>p.taskId===id&&p.workerId===u.id);S.shots=[];
  sheet('<h2>'+esc(t.title)+'</h2><div class="row wrap" style="margin-bottom:10px"><span class="badge b-i">'+esc(t.cat)+' - '+esc(t.sub||'')+'</span><b class="g">'+m(t.price)+'</b><span class="mu sm">'+filled(t)+'/'+t.max+' slots</span></div><p class="mu" style="white-space:pre-wrap;margin-bottom:12px">'+esc(t.desc)+'</p>'
  +(mine?'<div class="card c">You already did this task ('+mine.status.replace('_',' ')+')</div>':filled(t)>=t.max?'<div class="card c">No slots left</div>':'<button class="btn gh" onclick="A.open(\''+t.id+'\')">Open task link</button><div style="margin:12px 0"><label>Upload '+t.shots+' screenshot'+(t.shots>1?'s':'')+'</label><input type="file" accept="image/*" '+(t.shots>1?'multiple':'')+' onchange="A.pick(this,'+t.shots+')"><div class="shots" id="prev" style="margin-top:8px"></div></div>'+(t.needText?'<div style="margin:12px 0"><label>'+esc(t.textLabel||'Write here')+'</label><input id="wtx" maxlength="200"></div>':'')+'<div class="mu sm" id="tm" style="margin-bottom:8px"></div><button class="btn" id="sb" onclick="A.submit(\''+t.id+'\')">Submit proof</button>'))},
open(id){const t=tBy(id);openedAt[id]=now();let l=t.link;if(!/^https?:\/\//i.test(l)){return toast('Invalid link','err')}window.open(l,'_blank');const tick=()=>{const e=$('#tm');if(!e)return;const left=Math.ceil((t.timer||0)-(now()-openedAt[id])/1000);e.textContent=left>0?'Wait '+left+'s before submitting':'';if(left>0)setTimeout(tick,500)};tick()},
async pick(inp,max){if(max===1)S.shots=[];for(const f of inp.files){if(S.shots.length>=max)break;S.shots.push(await compress(f,S.user.ec))}A.prev()},
prev(){const e=$('#prev');if(e)e.innerHTML=S.shots.map(s=>'<img src="'+s+'">').join('')},
async submit(id){const t=tBy(id),u=S.user;if(!t)return;if(DB.proofs.find(p=>p.taskId===id&&p.workerId===u.id))return toast('Already done','err');if(now()>t.expires)return toast('Task expired','err');if(filled(t)>=t.max)return toast('No slots left','err');
  if(t.owner===u.id)return toast('You cannot do your own task','err');if(t.timer&&(!openedAt[id]||now()-openedAt[id]<t.timer*1000))return toast('Open the link and wait for the timer','err');
  if(S.shots.length<t.shots)return toast('Upload '+t.shots+' screenshot(s)','err');const wtx=t.needText?(($('#wtx')||{}).value||'').trim():'';if(t.needText&&wtx.length<2)return toast('Write what the task asks for','err');
  const b=$('#sb');if(b)b.disabled=true;let slot=null;
  try{slot=await claimSlot(t,u)}catch(e){if(b)b.disabled=false;return toast('Could not reserve a slot: '+e.message,'err')}
  if(slot===null){if(b)b.disabled=false;return toast('No slots left','err')}
  DB.proofs.push({id:uid(),taskId:id,workerId:u.id,slot,shots:S.shots.slice(0,t.shots),txt:wtx,status:'pending',t:now()});notify(t.owner,'New proof submitted for '+t.title,'proof');save();closeSheet();toast('Proof submitted','ok');render()},
approve(pid){const p=DB.proofs.find(x=>x.id===pid);if(!p||p.status!=='pending')return;confirmBox('Approve this proof and pay the worker?',()=>{p.buyerAct='Approved by '+(S.user.name)+' '+S.user.ec;payProof(p,'buyer');save();toast('Approved','ok');render()})},
reject(pid){const p=DB.proofs.find(x=>x.id===pid);sheet('<h2>Reject proof</h2><label>Reason</label><textarea id="rj" rows="3"></textarea><button class="btn rd" style="margin-top:10px" onclick="A.rejectDo(\''+pid+'\')">Reject</button>')},
rejectDo(pid){const p=DB.proofs.find(x=>x.id===pid),r=$('#rj').value.trim();if(r.length<3)return toast('Write a short reason','err');releaseSlot(p);p.status='rejected';p.buyerAct='Rejected by '+S.user.name+' '+S.user.ec+' ('+r+')';p.decidedAt=now();const t=tBy(p.taskId);notify(p.workerId,'Task proof rejected: '+t.title,'task');notify('admin','Proof rejected by buyer: '+t.title,'admin');save();closeSheet();toast('Rejected','ok');render()},
appeal(pid){sheet('<h2>Appeal</h2><p class="mu sm">Admin will review your proof. The decision is final.</p><label style="margin-top:10px">Reason</label><textarea id="ar" rows="3"></textarea><button class="btn" style="margin-top:10px" onclick="A.appealDo(\''+pid+'\')">Send appeal</button>')},
appealDo(pid){const r=$('#ar').value.trim();if(r.length<5)return toast('Explain why in a few words','err');const p=DB.proofs.find(x=>x.id===pid);p.status='appealed';p.appeal=r;notify('admin','New appeal from '+S.user.ec,'admin');save();closeSheet();toast('Appeal sent','ok');render()},

/* create task */
chip(el,id){el.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');$('#'+id).value=el.dataset.v;A.ccalc()},
wset(n){$('#cw').value=n;A.ccalc()},
ccat(){const C=getCats(),c=$('#cc').value;$('#cs').innerHTML=Object.keys(C[c]).map(x=>'<option>'+esc(x)+'</option>').join('');A.csub()},
csub(){const C=getCats(),c=$('#cc').value,s=$('#cs').value;$('#cp').value=C[c][s];A.ccalc()},
ccalc(){const st=getSet(),p=+$('#cp').value||0,w=Math.floor(+$('#cw').value)||0,n=+$('#cn').value||1,b=$('#cb').checked?.5:0,base=p*w,fee=base*st.taskFee/100,sh=st.shotFee*n,tot=base+fee+sh+b,u=S.user,sp=(+u.dep||0)+(+u.balance||0),unit=p*(1+st.taskFee/100),mx=unit>0?Math.max(0,Math.floor((sp-b-sh)/unit+1e-9)):0;
  const C=getCats(),mn=(C[$('#cc').value]||{})[$('#cs').value];$('#cpm').textContent=mn?'(min '+m(mn)+')':'';
  $('#cs2').innerHTML='<div class="row sp g" style="font-size:18px"><b>Total</b><b>'+m(tot)+'</b></div><div class="mu sm" style="margin-top:6px">You have '+m(sp)+'. You can afford up to <b>'+mx+'</b> workers at this price.</div>';return tot},
create(){const st=getSet(),C=getCats(),c=$('#cc').value,s=$('#cs').value,min=(C[c]||{})[s],t=$('#ct').value.trim(),d=$('#cd').value.trim(),l=$('#cl').value.trim(),p=+$('#cp').value,w=Math.floor(+$('#cw').value),n=+$('#cn').value,days=+$('#cx').value,u=S.user,tot=A.ccalc();
  if(t.length<4)return toast('Add a title','err');if(d.length<5)return toast('Add a description','err');if(!/^https?:\/\/\S+\.\S+/i.test(l))return toast('Link must start with https://','err');
  if(!(min>0))return toast('Choose a task type','err');if(p<min)return toast('Minimum price is '+m(min),'err');if(p>100)return toast('Maximum price is $100','err');if(!(w>=1))return toast('Enter the number of workers','err');
  const base=p*w;if(base<st.minBudget-1e-9)return toast('Minimum task budget is '+m(st.minBudget)+'. Add more workers or raise the price.','err');
  const sp=(+u.dep||0)+(+u.balance||0);if(tot>sp+1e-9)return toast('Not enough balance. Deposit first.','err');
  const needText=$('#ctx').checked,tl=$('#ctxl').value.trim();if(needText&&tl.length<2)return toast('Write what the worker should write','err');
  const boost=$('#cb').checked,useDep=Math.min(+u.dep||0,tot),useEarn=Math.max(0,tot-useDep);
  if(useDep>0)inc(u,'dep',-useDep);if(useEarn>0)bal(u,-useEarn);addLog(u,'spend',-tot,'Created task: '+t);
  DB.tasks.push({id:uid(),owner:u.id,title:t,desc:d,cat:c,sub:s,link:l,price:p,max:w,shots:n,timer:Math.max(0,+$('#cti').value||0),verOnly:$('#cv').checked,needText,textLabel:needText?tl:'',perSlot:p*(1+st.taskFee/100),total:tot-(boost?.5:0),paid:tot,fromDep:useDep,fromEarn:useEarn,fee:tot-base,created:now(),expires:now()+days*DAY,boost:boost?now()+DAY:0,status:'active'});
  save();toast('Task created','ok');go('mytasks')},

/* wallet */
depNext(){if(!S.method)return toast('Select a method','err');const a=+S.amt;if(!(a>=getApp().minDep))return toast('Minimum deposit is '+m(getApp().minDep),'err');S.step=2;render()},
deposit(){const a=+$('#da2').value,tx=$('#dt').value.trim(),M=getM().dep.find(x=>x.id===S.method);if(!M)return toast('Select a method','err');if(!(a>=getApp().minDep))return toast('Minimum deposit is '+m(getApp().minDep),'err');if(!/^[A-Za-z0-9]{10,64}$/.test(tx))return toast('TrxID must be 10+ letters/numbers','err');
  if(DB.deposits.some(d=>String(d.trx).toLowerCase()===tx.toLowerCase()))return toast('TrxID already used','err');if(!S.shots.length)return toast('Upload the payment screenshot','err');
  const u=S.user;DB.deposits.push({id:uid(),uid:u.id,name:u.name,ec:u.ec,amt:a,method:M.name,key:M.id,cur:M.type,bonus:M.bonusOn&&M.bonus>0?+M.bonus:0,trx:tx,shot:S.shots[0],status:'pending',t:now()});
  notify('admin','New deposit '+m(a)+' from '+u.ec,'admin');save();S.step=1;S.method=null;S.amt='';toast('Deposit submitted','ok');go('wallet')},
wcalc(){const M=getM().wd.find(x=>x.id===$('#wm').value),a=+$('#wa').value||0,n=a*(1-getSet().wdFee/100),l=$('#wl');if(l&&M)l.textContent=M.type==='usdt'?'Wallet address / Pay ID':'Account number';$('#wr').textContent=a&&M?('You receive: '+(M.type==='usdt'?m(n):'\u09f3'+Math.round(n*getSet().wdRate))):''},
withdraw(){const u=S.user,a=+$('#wa').value,M=getM().wd.find(x=>x.id===$('#wm').value),ac=$('#wc').value.trim(),st=getSet();if(!M)return toast('Select a method','err');
  if(st.kycReq&&!u.verified){toast('KYC verification is required to withdraw','err');return A.kycForm()}
  if(!(a>=getApp().minWd))return toast('Minimum withdrawal is '+m(getApp().minWd),'err');if(a>(+u.balance||0)+1e-9)return toast('Not enough earned balance. Deposited money cannot be withdrawn.','err');if(ac.length<5)return toast('Enter your account number','err');
  if(enc($('#wp').value)!==u.pass)return toast('Wrong password','err');
  if(DB.withdraws.filter(w=>w.uid===u.id&&day(w.t)===day()).length>=getApp().wdDay)return toast('Limit reached: '+getApp().wdDay+' withdrawals per day','err');
  bal(u,-a);addLog(u,'withdraw',-a,'Withdraw request');DB.withdraws.push({id:uid(),uid:u.id,name:u.name,ec:u.ec,amt:a,net:a*(1-st.wdFee/100),fee:a*st.wdFee/100,method:M.name,cur:M.type,acc:ac,status:'pending',t:now()});notify('admin','New withdraw '+m(a)+' from '+u.ec,'admin');save();toast('Withdrawal requested','ok');go('wallet')},
kycForm(){if(S.user.kycStatus==='pending')return toast('KYC is pending review');if(S.user.verified)return toast('You are verified','ok');S.ks=[null,null,null];
  sheet('<h2>KYC Verify</h2><div class="col"><div class="grid2"><div><label>First name</label><input id="k_f"></div><div><label>Last name</label><input id="k_l"></div></div><div class="grid2"><div><label>Date of birth</label><input id="k_d" type="date"></div><div><label>Place of birth</label><input id="k_p"></div></div><div><label>NID number</label><input id="k_n" inputmode="numeric"></div><div><label>NID front photo</label><input type="file" accept="image/*" onchange="A.pickK(this,0)"><div class="shots" id="kp0" style="margin-top:6px"></div></div><div><label>NID back photo</label><input type="file" accept="image/*" onchange="A.pickK(this,1)"><div class="shots" id="kp1" style="margin-top:6px"></div></div><div><label>Your photo (selfie)</label><input type="file" accept="image/*" onchange="A.pickK(this,2)"><div class="shots" id="kp2" style="margin-top:6px"></div></div><button class="btn" onclick="A.kycSend()">Submit</button></div>')},
async pickK(inp,i){const f=inp.files[0];if(!f)return;S.ks[i]=await compress(f,S.user.ec);const e=$('#kp'+i);if(e)e.innerHTML='<img src="'+S.ks[i]+'">'},
kycSend(){const f=$('#k_f').value.trim(),l=$('#k_l').value.trim(),d=$('#k_d').value,p=$('#k_p').value.trim(),n=$('#k_n').value.trim();if(f.length<2||l.length<1)return toast('Enter first and last name','err');if(!d)return toast('Enter date of birth','err');if(p.length<2)return toast('Enter place of birth','err');if(n.length<8)return toast('Enter the NID number','err');if(!S.ks||S.ks.some(x=>!x))return toast('Upload all 3 photos','err');
  DB.kyc.push({id:uid(),uid:S.user.id,ec:S.user.ec,name:f+' '+l,first:f,last:l,dob:d,pob:p,nid:n,shots:S.ks.slice(0,3),status:'pending',t:now()});S.user.kycStatus='pending';notify('admin','New KYC from '+S.user.ec,'admin');save();closeSheet();toast('KYC submitted','ok');render()},
kycView(id){const k=DB.kyc.find(x=>x.id===id);if(!k)return;const lb=['NID front','NID back','Selfie'];
  sheet('<h2>'+esc(k.name)+'</h2><div class="mu sm" style="margin-bottom:8px">'+esc(k.ec)+'</div><div class="card">'+kv('First name',esc(k.first||''))+kv('Last name',esc(k.last||''))+kv('Date of birth',esc(k.dob||''))+kv('Place of birth',esc(k.pob||''))+kv('NID number',esc(k.nid||''))+'</div>'+(k.shots||[]).map((s,i)=>'<div class="mu sm" style="margin:8px 0 4px">'+lb[i]+'</div><img src="'+s+'" style="width:100%;border-radius:12px" onclick="img(this.src)">').join('')+'<div class="grid2" style="margin-top:12px"><button class="btn rd" onclick="A.kycAct(\''+id+'\',0)">Reject</button><button class="btn gn" onclick="A.kycAct(\''+id+'\',1)">Approve</button></div>')},
kycAct(id,ok){const k=DB.kyc.find(x=>x.id===id),u=uBy(k.uid);if(k.status!=='pending')return;k.status=ok?'approved':'rejected';k.at=now();if(u){u.kycStatus=ok?'approved':'rejected';if(ok){u.verified=true;bal(u,.5);addLog(u,'bonus',.5,'KYC bonus')}notify(u.id,ok?'KYC approved. $0.50 bonus added':'KYC rejected','kyc')}save();closeSheet();render()},

ticket(){const s=$('#ts').value.trim(),g=$('#tm').value.trim();if(!s||!g)return toast('Fill subject and message','err');const mt=autoMatch(s+' '+g),o={id:uid(),uid:S.user.id,ec:S.user.ec,name:S.user.name,subj:s,msg:g,t:now()};if(mt){o.reply=mt;o.auto='kw'}DB.tickets.push(o);notify('admin','New ticket from '+S.user.ec,'admin');save();toast('Ticket sent','ok');render()},
chatEnter(){const u=S.user;if(!u)return;const c=chatEnsure(u),t=now();if(c.status==='open'){let ch=false;if(t-(c.lastSeen||0)>10000){c.lastSeen=t;ch=true}if((c.uSeen||0)<(c.lastAT||0)||t-(c.uSeen||0)>10000){c.uSeen=t;ch=true}if(ch)save()}closeIdleChats(u.id)},
chat(){const i=$('#cm'),v=i.value.trim();if(!v)return;const u=S.user,c=chatEnsure(u);if(c.status==='closed')return A.chatNew();const t=now(),hadAuto=chatMsgs(c).some(x=>x.from==='s'&&!x.sys);
  DB.chatmsgs.push({id:uid(),uid:u.id,n:c.n,from:'u',text:v,t});c.lastMsg=t;c.lastUserMsg=t;c.lastSeen=t;c.uSeen=t;c.name=u.name;c.ec=u.ec;c.lastText=v.slice(0,80);
  const mt=autoMatch(v);if(mt){DB.chatmsgs.push({id:uid(),uid:u.id,n:c.n,from:'s',text:mt,t:t+1});c.lastAT=t+1}else{c.needs=true;if(!c.wait)c.wait=t;if(!hadAuto){DB.chatmsgs.push({id:uid(),uid:u.id,n:c.n,from:'s',text:getAuto().def,t:t+1});c.lastAT=t+1}}
  i.value='';save();liveChat()},
chatNew(){const u=S.user,c=chatEnsure(u);c.n=(c.n||1)+1;c.status='open';c.started=now();c.lastMsg=0;c.lastUserMsg=0;c.lastSeen=now();c.lastText='';c.needs=false;c.wait=0;c.uSeen=now();c.lastAT=0;delete c.closedAt;save();render()},
openChat(uid){S.chatUid=uid;render()},
chatBack(){S.chatUid=null;render()},
achat(){const i=$('#am'),v=i.value.trim();if(!v||!S.chatUid)return;const c=DB.chats.find(x=>x.uid===S.chatUid);if(!c||c.status==='closed')return toast('This chat is closed','err');const t=now();DB.chatmsgs.push({id:uid(),uid:c.uid,n:c.n,from:'a',text:v,t});c.lastMsg=t;c.lastAT=t;c.lastText='You: '+v.slice(0,70);c.needs=false;c.wait=0;i.value='';save();liveChat()},
menu(){sheet('<h2>Menu</h2>'+GR.filter(g=>g.id!=='dash').map(g=>'<h3 class="mu" style="margin:12px 0 6px">'+g.n+'</h3><div class="chips" style="flex-wrap:wrap">'+g.subs.map(s=>'<span class="chip" onclick="closeSheet();A.tab(\''+s[0]+'\')">'+s[1]+cnt(subCnt(s[0]))+'</span>').join('')+'</div>').join('')+'<button class="btn gh" style="margin-top:16px" onclick="closeSheet();A.tab(\'dash\')">Dashboard</button>')},
saveApp(){const g=id=>$('#'+id),ok=u=>!u||/^https?:\/\/\S+\.\S+/i.test(u);const tg=g('ap_tg').value.trim(),tw=g('ap_tw').value.trim();if(!ok(tg)||!ok(tw))return toast('Links must start with https://','err');const nm=g('ap_n').value.trim();if(nm.length<2)return toast('Enter an app name','err');
  CFG.app={name:nm,tagline:g('ap_tl').value.trim(),foot:g('ap_ft').value.trim(),annOn:g('ap_ao').checked,ann:g('ap_a').value.trim(),tickOn:g('ap_to').checked,tick:g('ap_t').value.trim(),contest:g('ap_c').value.trim(),tg,tw,regOpen:g('ap_ro').checked,minDep:Math.max(.01,+g('ap_md').value||1),minWd:Math.max(.01,+g('ap_mw').value||1),wdDay:Math.max(1,Math.floor(+g('ap_wd').value||3))};save();document.title=nm;toast('Saved','ok')},
readAll(){const to=S.admin?'admin':S.user.id;DB.notifs.filter(n=>n.to===to).forEach(n=>n.read=true);save();render()},
clearN(){const to=S.admin?'admin':S.user.id;DB.notifs=DB.notifs.filter(n=>n.to!==to);save();render()},

/* admin */
proof(pid){const p=DB.proofs.find(x=>x.id===pid),w=uBy(p.workerId),t=tBy(p.taskId),b=t&&uBy(t.owner);
  const can=['pending','rejected','appealed','rejected_final'].includes(p.status);
  sheet('<h2>'+esc(w?w.name:'?')+' '+(w?w.ec:'')+'</h2><div class="mu sm" style="margin-bottom:8px">'+esc(t?t.title:'')+' - pays '+m(t?t.price:0)+'<br>Buyer: '+(b?esc(b.name)+' '+b.ec:'?')+'<br>Status: '+p.status.replace('_',' ')+'</div>'+(p.buyerAct?'<div class="card y sm">Buyer decision: '+esc(p.buyerAct)+'</div>':'')+(p.appeal?'<div class="card sm">Worker appeal: '+esc(p.appeal)+'</div>':'')+(p.txt?'<div class="card sm">'+esc((t&&t.textLabel)||'Text')+': <b>'+esc(p.txt)+'</b></div>':'')+'<div class="shots" style="margin-bottom:12px">'+(p.shots||[]).map(s=>'<img src="'+s+'" onclick="img(this.src)">').join('')+'</div>'
  +(can?'<div class="grid2">'+(p.status==='rejected_final'?'<span></span>':'<button class="btn rd" onclick="A.pDo(\''+pid+'\',0)">Reject</button>')+'<button class="btn gn" onclick="A.pDo(\''+pid+'\',1)">Approve</button></div>':'<div class="c mu">Final: '+p.status+'</div>'))},
pDo(pid,ok){const p=DB.proofs.find(x=>x.id===pid),t=tBy(p.taskId);if(ok){payProof(p,'admin');p.adminAct='Approved by admin';}else{releaseSlot(p);p.status='rejected_final';p.adminAct='Rejected by admin';p.decidedAt=now();notify(p.workerId,'Task proof rejected (final): '+t.title,'task')}save();closeSheet();toast(ok?'Approved and paid':'Rejected','ok');render()},
dep(id){const d=DB.deposits.find(x=>x.id===id);sheet('<h2>'+esc(d.name)+' '+d.ec+'</h2><p class="mu sm">'+m(d.amt)+' via '+esc(d.method)+' - '+fd(d.t)+(d.bonus?' - bonus '+d.bonus+'%':'')+'<br>TrxID: '+esc(d.trx)+'</p>'+(d.shot?'<img src="'+d.shot+'" style="width:100%;border-radius:12px;margin:10px 0">':'')+'<div class="grid2"><button class="btn rd" onclick="A.depDo(\''+id+'\',0)">Reject</button><button class="btn gn" onclick="A.depDo(\''+id+'\',1)">Approve</button></div>')},
depDo(id,ok){const d=DB.deposits.find(x=>x.id===id),u=uBy(d.uid);if(d.status!=='pending')return;d.status=ok?'approved':'rejected';d.at=now();
  if(ok&&u){const f0=getSet().depFee/100,bn=d.bonus!==undefined?d.bonus:(d.key==='binance'?5:0),c=d.amt*(1-f0)*(1+bn/100);d.fee=d.amt*f0;inc(u,'dep',c);addLog(u,'deposit',c,'Deposit approved (use for tasks)');notify(u.id,'Deposit Approved '+m(d.amt),'deposit')}else if(u)notify(u.id,'Deposit rejected '+m(d.amt),'deposit');save();closeSheet();toast('Done','ok');render()},
wd(id,ok){const d=DB.withdraws.find(x=>x.id===id),u=uBy(d.uid);if(d.status!=='pending')return;d.status=ok?'approved':'rejected';d.at=now();if(!ok&&u){bal(u,d.amt);addLog(u,'refund',d.amt,'Withdraw rejected, refunded')}if(u)notify(u.id,ok?'Withdraw Approved '+m(d.amt):'Withdraw rejected, balance refunded','withdraw');save();toast('Done','ok');render()},

saveAdm(){const id=$('#sa').value.trim(),p=$('#sp').value,a=Object.assign({},getAdm());if(id.length<4)return toast('ID too short','err');a.id=id;if(p){if(p.length<6)return toast('Password needs 6+ characters','err');a.pass=enc(p)}CFG.admin=a;save();toast('Saved','ok')},
saveSet(){setSet({maint:$('#sm').checked,kycReq:$('#sk').checked,depRate:+$('#sd').value||130,wdRate:+$('#sw').value||123});toast('Saved','ok')},
ban(id){const u=uBy(id);u.banned=!u.banned;save();refresh()},
editBal(id){const u=uBy(id);sheet('<h2>Edit balance</h2><p class="mu sm">'+esc(u.name)+' '+u.ec+'</p><label>Earned balance (withdrawable)</label><input id="eb" type="number" step="0.001" value="'+(+u.balance||0)+'"><label style="margin-top:8px">Deposit balance (task only)</label><input id="ebd" type="number" step="0.001" value="'+(+u.dep||0)+'"><button class="btn" style="margin-top:10px" onclick="A.ebDo(\''+id+'\')">Save</button>')},
ebDo(id){const u=uBy(id),v=+$('#eb').value,w=+$('#ebd').value;if(isNaN(v)||v<0||isNaN(w)||w<0)return toast('Invalid amount','err');const v0=+u.balance||0,w0=+u.dep||0;if(v!==v0){addLog(u,'admin',v-v0,'Balance edited by admin');bal(u,v-v0)}if(w!==w0){addLog(u,'admin',w-w0,'Deposit balance edited by admin');inc(u,'dep',w-w0)}save();closeSheet();refresh()},
viewTasks(id){const a=DB.tasks.filter(t=>t.owner===id);sheet('<h2>Tasks</h2>'+(a.map(t=>'<div class="item"><b>'+esc(t.title)+'</b><div class="mu sm">'+m(t.price)+' - '+t.status+'</div></div>').join('')||'<p class="mu c">No tasks</p>'))},
delUser(id){confirmBox('Delete this user?',()=>{DB.users=DB.users.filter(u=>u.id!==id);save();refresh()})},
delTask(id){confirmBox('Delete this task?',()=>{DB.tasks=DB.tasks.filter(t=>t.id!==id);DB.claims=DB.claims.filter(c=>c.taskId!==id);save();refresh()})},
boost(id){const t=tBy(id);t.boost=t.boost>now()?0:now()+DAY;save();refresh()},
editTask(id){const t=tBy(id);sheet('<h2>Edit task</h2><div class="col"><input id="et" value="'+esc(t.title)+'"><textarea id="ed" rows="3">'+esc(t.desc)+'</textarea><button class="btn" onclick="A.etDo(\''+id+'\')">Save</button></div>')},
etDo(id){const t=tBy(id);t.title=$('#et').value.trim()||t.title;t.desc=$('#ed').value.trim()||t.desc;save();closeSheet();refresh()},
workers(id){const a=DB.proofs.filter(p=>p.taskId===id);sheet('<h2>Workers</h2>'+(a.map(p=>{const w=uBy(p.workerId);return '<div class="item" onclick="A.proof(\''+p.id+'\')"><b>'+esc(w?w.name:'?')+'</b> <span class="badge '+pstat(p.status)+'">'+p.status.replace('_',' ')+'</span></div>'}).join('')||'<p class="mu c">Nobody joined yet</p>'))},
reply(id){sheet('<h2>Reply</h2><textarea id="rp2" rows="3"></textarea><button class="btn" style="margin-top:10px" onclick="A.replyDo(\''+id+'\')">Send reply</button>')},
replyDo(id){const t=DB.tickets.find(x=>x.id===id);t.reply=$('#rp2').value.trim();if(!t.reply)return;delete t.auto;notify(t.uid,'Support replied: '+t.reply,'support');save();closeSheet();render()},
exp(){const b=new Blob([JSON.stringify({db:DB,cfg:CFG})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);const d=new Date();a.download='backup_'+String(d.getDate()).padStart(2,'0')+d.toLocaleString('en',{month:'short'})+d.getFullYear()+'.json';a.click();LS.set('ec_lastbackup',now())},
imp(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.db||!j.db.users)throw 0;COLS.forEach(c=>{DB[c]=Array.isArray(j.db[c])?j.db[c]:[]});if(j.cfg)CFG=j.cfg;else{if(j.pay)CFG.pay=j.pay;if(j.adm)CFG.admin=j.adm;if(j.set)CFG.settings=j.set}save();toast('Restored','ok');render()}catch(e){toast('Invalid backup file','err')}};r.readAsText(f)},
reset(){sheet('<h2>Reset all data</h2><p class="mu sm" style="margin-bottom:10px">This deletes all users, tasks and history from the server and cannot be undone. Type RESET to confirm.</p><input id="rsx" placeholder="RESET"><button class="btn rd" style="margin-top:10px" onclick="A.resetDo()">Delete everything</button>')},
resetDo(){if($('#rsx').value.trim()!=='RESET')return toast('Type RESET to confirm','err');COLS.forEach(c=>{DB[c]=[]});save();closeSheet();toast('Reset done','ok');render()},
grp(id){const g=GR.find(x=>x.id===id);if(!g.subs.some(s=>s[0]===S.tab))S.tab=g.subs[0][0];S.page=1;S.q='';render()},
saveM(sec,id){const M=JSON.parse(JSON.stringify(getM())),x=M[sec].find(y=>y.id===id);if(!x)return;const nm=$('#mn_'+sec+'_'+id).value.trim().replace(/[.$#\[\]\/]/g,'');if(!nm)return toast('Enter a name','err');x.name=nm;x.on=$('#mo_'+sec+'_'+id).checked;
  if(sec==='dep'){x.num=$('#mu_'+sec+'_'+id).value.trim();x.bonusOn=$('#mb_'+sec+'_'+id).checked;x.bonus=Math.max(0,+$('#mp_'+sec+'_'+id).value||0);if(x.on&&!x.num)return toast('Add the number/address before turning ON','err')}
  CFG.methods={v:2,dep:M.dep,wd:M.wd};save();toast('Saved','ok')},
delM(sec,id){confirmBox('Delete this method?',()=>{const M=JSON.parse(JSON.stringify(getM()));M[sec]=M[sec].filter(y=>y.id!==id);CFG.methods={v:2,dep:M.dep,wd:M.wd};save();render()})},
addM(sec){const nm=$('#an_'+sec).value.trim().replace(/[.$#\[\]\/]/g,''),ty=$('#at_'+sec).value;if(!nm)return toast('Enter a name','err');const M=JSON.parse(JSON.stringify(getM())),x={id:'m'+uid(),name:nm,type:ty,on:true,color:['#00D1FF','#FF8A00','#7C4DFF','#00C853','#FF4081'][M[sec].length%5]};
  if(sec==='dep'){x.num=$('#au_dep').value.trim();if(!x.num)return toast('Enter the number/address','err');x.bonusOn=$('#ab_dep').checked;x.bonus=Math.max(0,+$('#ap_dep').value||0)}
  M[sec].push(x);CFG.methods={v:2,dep:M.dep,wd:M.wd};save();toast('Added','ok');render()},
pSave(){const o={};let bad=0;document.querySelectorAll('.pin').forEach(i=>{const c=i.dataset.c,t=i.dataset.t,v=+i.value;if(!(v>0)){bad=1;return}(o[c]=o[c]||{})[t]=Math.round(v*1e6)/1e6});if(bad)return toast('Every price must be above 0','err');CFG.prices=o;save();toast('Prices saved','ok')},
pAll(){const pc=+$('#pp').value;if(!pc||pc<=-100)return toast('Enter a percent like 10 or -10','err');const C=JSON.parse(JSON.stringify(getCats()));Object.keys(C).forEach(c=>Object.keys(C[c]).forEach(t=>{C[c][t]=Math.max(.001,Math.round(C[c][t]*(1+pc/100)*1e6)/1e6)}));CFG.prices=C;save();toast('All prices changed by '+pc+'%','ok');render()},
pDel(i){const c=i.dataset.c,t=i.dataset.t;confirmBox('Remove "'+t+'" from '+c+'?',()=>{const C=JSON.parse(JSON.stringify(getCats()));delete C[c][t];if(!Object.keys(C[c]).length)delete C[c];CFG.prices=Object.keys(C).length?C:DEFCATS;save();render()})},
pAdd(){const c=$('#pa_c').value.trim().replace(/[.$#\[\]\/]/g,''),t=$('#pa_t').value.trim().replace(/[.$#\[\]\/]/g,''),p=+$('#pa_p').value;if(!c||!t||!(p>0))return toast('Enter category, type and a price','err');const C=JSON.parse(JSON.stringify(getCats()));(C[c]=C[c]||{})[t]=p;CFG.prices=C;save();toast('Added','ok');render()},
fSave(){const g=id=>+$('#'+id).value,v={depFee:g('f_d'),wdFee:g('f_w'),taskFee:g('f_t'),shotFee:g('f_s'),minBudget:g('f_m')};if(Object.values(v).some(x=>isNaN(x)||x<0))return toast('Enter valid numbers','err');if(v.depFee>50||v.wdFee>50||v.taskFee>50)return toast('Fees cannot be above 50%','err');setSet(v);toast('Saved','ok')},
saveRefP(){const v=+$('#rf_p').value;if(isNaN(v)||v<0||v>100)return toast('Enter 0 to 100','err');setSet({refPct:v});toast('Saved','ok')},
saveRefB(){const n=Math.max(1,Math.floor(+$('#rb_n').value||10)),a=+$('#rb_a').value;if(isNaN(a)||a<0)return toast('Enter a valid bonus','err');CFG.refb={on:$('#rb_on').checked,tasks:n,amt:a,caption:$('#rb_c').value.trim()||getRefB().caption};save();toast('Saved','ok')},
saveShare(){const c=$('#sh_c').value.trim();if(!c)return toast('Write a caption','err');CFG.share={caption:c};save();toast('Saved','ok')},
autoDef(){const v=$('#ad_def').value.trim();if(!v)return toast('Write a reply','err');CFG.auto={def:v,rules:getAuto().rules||[]};save();toast('Saved','ok')},
autoAdd(){const k=$('#ak_new').value.trim(),r=$('#ar_new').value.trim();if(!k||!r)return toast('Add keywords and a reply','err');const a=getAuto();CFG.auto={def:a.def,rules:(a.rules||[]).concat([{id:uid(),kw:k,reply:r}])};save();toast('Added','ok');render()},
autoSave(id){const a=getAuto(),k=$('#ak_'+id).value.trim(),r=$('#ar_'+id).value.trim();if(!k||!r)return toast('Add keywords and a reply','err');CFG.auto={def:a.def,rules:(a.rules||[]).map(x=>x.id===id?{id,kw:k,reply:r}:x)};save();toast('Saved','ok')},
autoDel(id){const a=getAuto();CFG.auto={def:a.def,rules:(a.rules||[]).filter(x=>x.id!==id)};save();render()},
logoPick(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{const f=i.files[0];if(!f)return;CFG.logo=await sq(f,256,'png');save();toast('Logo changed','ok');render()};i.click()},
logoReset(){delete CFG.logo;save();toast('Default logo restored','ok');render()},
avatar(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{const f=i.files[0];if(!f)return;S.user.avatar=await sq(f,160,'jpeg');save();toast('Photo updated','ok');render()};i.click()},
demo(){const mk=(n,e,ec,b,d)=>({id:uid(),ec,name:n,email:e,phone:'018'+Math.floor(1e7+Math.random()*9e7),pass:enc('123456'),balance:b,dep:d,earned:0,created:now(),tasksDone:0,fp:uid()});
  if(uEc('EC-1001'))return toast('Demo data already loaded','err');
  const buyer=mk('Rafi Buyer','buyer@test.com','EC-1001',0,50),w1=mk('Sakil','sakil@test.com','EC-4887',0,0),w2=mk('Lavly Akter','lavly@test.com','EC-8080',0,0);
  w2.refBy=w1.id;DB.users.push(buyer,w1,w2);
  const t={id:uid(),owner:buyer.id,title:'Subscribe to my YouTube channel',desc:'Subscribe and send a screenshot.',cat:'YouTube',sub:'Subscribe',link:'https://youtube.com',price:.015,max:10,shots:1,timer:0,total:.2,paid:.2,fromDep:.2,fromEarn:0,fee:.05,created:now(),expires:now()+5*DAY,boost:0,status:'active'};DB.tasks.push(t);
  const p1={id:uid(),taskId:t.id,workerId:w1.id,slot:0,shots:[fakeShot('Proof pending')],status:'pending',t:now()-3600000},p2={id:uid(),taskId:t.id,workerId:w2.id,slot:1,shots:[fakeShot('Proof rejected')],status:'rejected',buyerAct:'Rejected by Rafi Buyer EC-1001 (not clear)',t:now()-7200000,decidedAt:now()-3600000};DB.proofs.push(p1,p2);
  DB.claims.push({id:t.id+'_0',taskId:t.id,uid:w1.id,slot:0,t:now()});
  DB.deposits.push({id:uid(),uid:w2.id,name:'Lavly Akter',ec:'EC-8080',amt:100,method:'Nagad',key:'nagad',cur:'local',bonus:0,trx:'Hahahahhaa',shot:fakeShot('Deposit shot'),status:'pending',t:now()-1800000});
  save();toast('Demo loaded. Users: buyer@test.com / sakil@test.com / lavly@test.com, password 123456','ok');render()}
};

/* ============ INIT ============ */
window.addEventListener('online',banner);window.addEventListener('offline',banner);banner();
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window._ip=e});
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>lastAct=now(),{passive:true}));
setInterval(()=>{if(S.sess){const idle=now()-lastAct;if(idle>30*60000){toast('Logged out due to inactivity','err');A.logout()}else if(idle>28*60000)toast('Session expires in 2 minutes')}expireTasks()},60000);
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('focusout',()=>{if(PENDING)setTimeout(softRender,400)});
setInterval(()=>{if(LOADED){expireTasks();if(S.admin)cleanup()}},60000);
setInterval(()=>{if(!LOADED)return;if(S.admin){closeIdleChats();if(S.tab==='inbox'&&!S.chatUid)softRender()}else if(S.user&&S.view==='chat'){const c=chatOf(S.user);if(c&&c.status==='open'&&(c.lastUserMsg||0)>0){c.lastSeen=now();c.uSeen=now();save()}closeIdleChats(S.user.id)}},20000);
applyTheme();connect();
if(S.sess)S.view='home';
if(URLREF&&!S.sess){S.view='auth';S.p='reg'}
render();
</script>
